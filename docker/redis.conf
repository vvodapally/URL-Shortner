# docker/redis.conf
# Redis configuration for the URL shortener service.
#
# Key reliability settings (Scenario 3 — "make it reliable"):
#   appendonly yes      — enables AOF (append-only file) persistence
#   appendfsync everysec — fsync once per second; balance of durability vs I/O

# Persistence
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Network
bind 0.0.0.0
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Logging
loglevel notice

# Slow log (queries taking >10ms logged for observability)
slowlog-log-slower-than 10000
slowlog-max-len 128
