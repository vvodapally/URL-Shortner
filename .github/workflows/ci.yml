name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          PYTHONPATH=. python tests/unit/test_core.py
          PYTHONPATH=. python tests/unit/test_utils.py
          PYTHONPATH=. python tests/unit/test_analytics.py

      - name: Run orchestration scenarios
        run: |
          PYTHONPATH=. python orchestration/workflows/greenfield.py
          PYTHONPATH=. python orchestration/workflows/brownfield.py
          PYTHONPATH=. python orchestration/workflows/ambiguous.py