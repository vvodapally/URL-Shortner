name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests (no services)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          PYTHONPATH=. python tests/unit/test_orchestration_engine.py
          PYTHONPATH=. python tests/unit/test_core.py
          PYTHONPATH=. python tests/unit/test_utils.py
          PYTHONPATH=. python tests/unit/test_analytics.py

      - name: Run orchestration scenarios (auto-gate mode)
        run: |
          PYTHONPATH=. python -m orchestration.workflows.greenfield
          PYTHONPATH=. python -m orchestration.workflows.brownfield
          PYTHONPATH=. python -m orchestration.workflows.ambiguous

  integration-tests:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: urlshortener_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: urlshortener_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          REDIS_HOST: localhost
          ENVIRONMENT: test
          RATE_LIMIT_REQUESTS: "5"
          ANALYTICS_FLUSH_INTERVAL: "1.0"
        run: |
          PYTHONPATH=. pytest tests/integration/ -v -m integration
